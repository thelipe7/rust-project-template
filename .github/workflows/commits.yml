name: Commits

# CONTRIBUTING asks every commit for a Conventional Commit subject, and a
# requirement nothing checks is a request.
#
# The commits are the load-bearing half: this repository merges by rebase, so
# each one lands as written, and a template release is a tag over that
# history — the subjects are what a reader skims to see what a new tag
# changes before running `copier update` toward it.
#
# The title is checked too: it is what the pull request list and every link
# to this change are read as.
on:
  pull_request:
    # `edited` because a title can be rewritten after the pull request is
    # opened, and the check has to run again when it is.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# The types the changelog groups by, in one place for both jobs. Adding one
# here means adding it to CONTRIBUTING too, which is where a contributor looks
# first.
env:
  TYPES: build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test

jobs:
  commits:
    name: Every commit says what it is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, because the check walks base..head.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the subject of each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # `type(optional scope)!: description`, with `!` marking a breaking
          # change. `--no-merges` because a merge commit carries a message
          # nobody wrote and the rebase drops it anyway.
          pattern="^(${TYPES})(\([a-z0-9][a-z0-9._/-]*\))?!?: .+"
          malformed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject="$(git show --no-patch --format='%s' "$commit")"
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::$commit — '$subject' is not a Conventional Commit subject"
              malformed=1
            fi
          done
          if [ "$malformed" -ne 0 ]; then
            echo "::error::expected '<type>(<scope>): <description>', where type is one of: ${TYPES//|/, }"
            echo "::error::mark a breaking change with '!' before the colon, as in 'feat!: drop the v1 format'"
          fi
          exit "$malformed"

  title:
    name: The pull request says what it is
    runs-on: ubuntu-latest
    # No checkout: the title arrives in the event, and nothing here reads the
    # tree.
    steps:
      - name: Check the title
        env:
          # Through the environment, never interpolated into the script. A
          # title is text somebody else wrote, and `${{ ... }}` would paste it
          # in before the shell ever saw a quote in it.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern="^(${TYPES})(\([a-z0-9][a-z0-9._/-]*\))?!?: .+"
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            exit 0
          fi
          echo "::error::'$TITLE' is not a Conventional Commit subject"
          echo "::error::expected '<type>(<scope>): <description>', where type is one of: ${TYPES//|/, }"
          exit 1
