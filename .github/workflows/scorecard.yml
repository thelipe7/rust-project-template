name: Scorecard

# The OpenSSF Scorecard grades this repository's supply-chain practices —
# pinned actions, token permissions, branch protection, dependency updates —
# and publishes the score, which a stranger deciding whether to trust this
# project can read without reading everything else. The findings also land in
# the Security tab as code-scanning alerts.
#
# Weekly and on push to main: the score changes when practices change, not
# when code does.
on:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Supply-chain score
    runs-on: ubuntu-latest
    permissions:
      # Where the SARIF findings go.
      security-events: write
      # Publishing the score is a signed claim about this repository, and the
      # OIDC token is how the scorecard API verifies who is claiming it. This
      # is the one job outside releasing that needs `id-token`.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # What turns the run into the badge and the public API entry.
          # Public repositories only — a private repository's run still works,
          # but publishes nothing.
          publish_results: true

      - name: Attach the results to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
