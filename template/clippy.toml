# Clippy's own configuration: the thresholds a few lints read, and the lists
# the `disallowed_*` lints work from.
#
# `expect_used` is on, and the gate denies warnings — so without these two a
# single `.expect()` inside a `#[test]` fails the build. Wrong answer: the
# lint is about production paths; a test reports failure by panicking.
#
# Mind the edge: these cover `#[test]` functions and `#[cfg(test)]` modules,
# and nothing else. A helper function in a `tests/` file, or a public fake
# behind a feature, is outside them — those carry their own
# `#[expect(clippy::expect_used, reason = "...")]`.
allow-expect-in-tests = true
allow-unwrap-in-tests = true

# Nothing else is set, on purpose. Every other entry here is a rule about
# this project in particular, and the useful ones are discovered rather than
# guessed.
#
# `disallowed-methods` earns its place most often: it turns a boundary a
# design decision drew into a compile error, and each entry carries the
# reason:
#
#   disallowed-methods = [
#       { path = "std::env::set_var", reason = "config is read once at startup and never mutated" },
#   ]
#
# `disallowed-types` and `disallowed-macros` take the same shape. A call that
# has to be made anyway gets `#[expect(clippy::disallowed_methods,
# reason = "...")]` next to it: the exception is written down where it
# happens.
