# How TOML is formatted, checked by `cargo xtask lint`. This repository is
# mostly TOML — manifests, lint tables, dependency policy, release
# configuration — and nothing else formats it.
#
# Two settings, both keeping taplo from undoing what the files already do.
# Everything else is taplo's default, on purpose: a formatter exists to end
# the argument, and a long configuration file is the argument moved.
[formatting]
# A one-line list stops being readable at the third entry, and every list
# here is edited and diffed one line at a time.
array_auto_collapse = false
# Four, matching the Rust beside it. taplo's own default is two.
indent_string = "    "
