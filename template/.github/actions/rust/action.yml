name: Rust
description: The toolchain, the build cache and any cargo tools a job needs.

# One place, because five workflows needed the same three steps and a setup
# that drifts between them is a job that passes for a reason none of the
# others share.

inputs:
  tools:
    description: Cargo tools to install, as taiki-e/install-action names them.
    required: false
    default: ""
  apt:
    description: >-
      Extra system packages this job alone needs on Linux, space-separated.
      The packages the whole project needs belong in `.github/system-packages`,
      which every job reads without being told; this is for the one job that
      needs something more. Ignored on other runners, where the names would
      not resolve anyway.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A native dependency is a property of the project, not of the job that
    # happened to trigger the link error — so the list lives in one file every
    # job reads, rather than in an argument eight workflows have to repeat and
    # a `copier update` has to merge eight times.
    #
    # Comments and blank lines are stripped so the file can say why a package
    # is there, which is the question asked about it a year later.
    - if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA: ${{ inputs.apt }}
      run: |
        packages=()
        if [ -f .github/system-packages ]; then
          while read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            read -ra words <<< "$line"
            packages+=("${words[@]}")
          done < .github/system-packages
        fi
        read -ra extra <<< "$EXTRA"
        packages+=("${extra[@]}")
        if [ "${#packages[@]}" -gt 0 ]; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
        fi

    # Installs the toolchain pinned in rust-toolchain.toml. Before the cache,
    # which keys on the Rust version it finds.
    - run: rustup toolchain install
      shell: bash

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Bump to walk away from a poisoned lineage: this action never
        # overwrites a key it restored in full, so a bad entry persists until
        # the prefix changes.
        prefix-key: v1-rust
        # Only the default branch writes. A pull request's cache is scoped to
        # its own ref, so nothing else can read what it saves — it only spends
        # the cache budget and evicts entries every other run lives on. A pull
        # request reads main's and leaves it alone.
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - if: inputs.tools != ''
      uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
      with:
        tool: ${{ inputs.tools }}
