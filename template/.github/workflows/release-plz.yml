name: Prepare release

# Keeps a pull request open that carries the next version and the changelog
# entries for everything merged since the last one. It prepares; merging it is
# what decides.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads every commit since the last release to write the
          # changelog, so a shallow checkout would write an empty one.
          fetch-depth: 0
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - name: Create or update release pull request
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
