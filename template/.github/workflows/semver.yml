name: Semver

# What breaks a consumer is a public API change the version number does not
# admit to. release-plz runs cargo-semver-checks when it prepares a release —
# after the merge, when the finding is a fact rather than a decision. This
# asks the same question on the pull request, where the answer can still
# change the change.
#
# Not a required check: it compares against the version on crates.io, and
# before the first publish there is nothing to compare with — the step below
# asks first and the check passes quietly until then.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: semver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The crate name is the repository name — the template generates both
      # from one answer, and Cargo.toml's `repository` field records the pair.
      - name: Is a baseline published?
        id: baseline
        env:
          CRATE: ${{ github.event.repository.name }}
        run: |
          status="$(curl --proto '=https' --tlsv1.2 -s -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE")"
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$CRATE is not on crates.io yet, so there is no baseline to compare against."
          fi

      - name: Check the API against the published baseline
        if: steps.baseline.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
