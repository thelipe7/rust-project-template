name: Mutants

# Coverage says a line ran; it does not say a test would notice the line
# being wrong. cargo-mutants injects small deliberate bugs — an operator
# swapped, a return value replaced — and counts how many survive the suite.
# A surviving mutant is a place a real bug could live undetected.
#
# Weekly and on dispatch, never in the gate: it re-runs the suite once per
# mutant, which is hours where the gate is minutes, and its findings are
# work to schedule rather than a change to block.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          tools: cargo-mutants,cargo-nextest

      - name: Inject bugs and run the suite against each
        run: cargo mutants -vV --in-place

      # The report is the point of the run, and the run fails exactly when
      # the report has something to say.
      - name: Attach the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out
