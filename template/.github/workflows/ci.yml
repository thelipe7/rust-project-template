name: CI

# The branch globs are not decoration. A pull request opened by a workflow
# using GITHUB_TOKEN triggers no `pull_request` runs — GitHub's rule, so that
# automation cannot start automation — which would leave the release and
# template-update pull requests with no checks at all. A status attaches to a
# commit rather than to an event, so running on the branch push satisfies the
# same required check on the same head commit.
on:
  pull_request:
  push:
    branches: [main, "release-plz-**", "automation/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The `ci` profile in .config/nextest.toml — one run reporting every
  # failure, not the first. A profile is only active where something names
  # it, and this is where CI names it.
  NEXTEST_PROFILE: ci
  # Full debug info is the largest thing a CI build writes to disk, and
  # nothing here reads it: no debugger attaches to a runner, and a backtrace
  # needs line tables only. Left on, a workspace with a wide dependency tree
  # fills the runner's disk before the gate finishes — and the error it fails
  # with names whatever step happened to be running, not the debug info.
  #
  # Here rather than in Cargo.toml, so a developer's own builds keep the debug
  # info a debugger needs. CI is the one place nothing does.
  RUSTFLAGS: -C debuginfo=line-tables-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gate is `cargo xtask ci` split across runners. One command locally, where
# a developer wants one answer; one job per task here, where the tasks do not
# depend on each other and a runner waiting on the previous one is a runner
# idle for as long as that one takes. Run in sequence, the slowest task decides
# nothing and the sum decides everything.
#
# `check` and `lint` share a job because they share their build: clippy reuses
# the artifacts `cargo check` just wrote, so together they cost what `check`
# costs alone, and apart they cost it twice. `docs` rides along for the same
# reason. Everything else builds its own tree and belongs somewhere else.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each task shells out to these; without them it fails on the missing
      # subcommand rather than on the code.
      - uses: ./.github/actions/rust
        with:
          tools: cargo-deny,cargo-machete,taplo,typos

      - run: cargo xtask check
      - run: cargo xtask lint
      - run: cargo xtask docs

  # One build of the workspace per feature, which is why it is not bundled
  # with anything: whatever it shares a job with waits for all of them.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          tools: cargo-hack

      - run: cargo xtask features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          tools: cargo-nextest

      - run: cargo xtask test

  # Formatting, the dependency tree, the feature powerset and the docs answer
  # the same everywhere, and asking six times buys six identical answers — so
  # the jobs above run on Linux only.
  #
  # Compiling and running the tests is the part that does differ — a path
  # separator, a `#[cfg(unix)]`, a dependency with no Windows story — so that
  # part runs on every platform this ships to, and only that part.
  #
  # No `needs:`. Waiting for the Linux gate to go green before starting the
  # other five machines adds the gate's whole runtime to every green run, to
  # save runner minutes on the red ones — and a red run is where knowing
  # whether Windows is also broken is worth most. `concurrency` above already
  # cancels the runs a new push obsoletes, which is where the minutes actually
  # go.
  #
  # `windows-aarch64` is here because GitHub now rents an ARM Windows machine;
  # before it did, that target first ran on somebody's laptop.
  platforms:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One red platform should not hide the other four. Knowing whether a
      # change broke Windows or broke everything is the whole point of asking.
      fail-fast: false
      matrix:
        include:
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-latest }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-latest }
          - { platform: windows-aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          tools: cargo-nextest

      - run: cargo xtask check
      - run: cargo xtask test

  # Coverage is reported, not enforced: a threshold is a number somebody
  # negotiates with rather than a defect it finds. The useful form is the
  # reviewer seeing which lines went untested, so the summary goes in the job
  # summary, where it is read, not only into an artifact.
  #
  # On the default branch only. It is a third instrumented build of a
  # workspace two jobs above have already built, for a number nothing blocks
  # on — so it is worth its runner where the trend is read, and not worth one
  # on every push to every branch.
  #
  # xtask is excluded: it is build tooling, and counting it moves the number
  # without telling anybody anything.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          tools: cargo-llvm-cov,cargo-nextest
      - name: Measure
        run: |
          cargo llvm-cov --workspace --all-features --locked \
            --ignore-filename-regex '(^|/)xtask/' \
            --lcov --output-path lcov.info
      - name: Report
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only \
              --ignore-filename-regex '(^|/)xtask/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  # Workflows are the one part of this repository nothing compiles or runs
  # before it reaches main. Three independent questions: actionlint parses
  # them and the shell inside them, zizmor asks whether they are safe, and
  # the pin check asks whether an external action can change under us.
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    # zizmor's online audits authenticate with the plain GH_TOKEN passed
    # below; nothing here needs more than reading the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint

      - name: Lint
        run: ./actionlint -color

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: zizmor

      # Template injection, leaked credentials, unused permissions.
      # `--persona=regular` leaves out the findings only worth arguing about;
      # a deliberate finding is silenced at the line with a
      # `# zizmor: ignore[audit-name]` comment carrying its reason.
      #
      # `--min-confidence=medium` because the low-confidence audits are
      # heuristics about intent rather than readings of the workflow: the
      # cache-poisoning audit fires on any `setup-` action that caches by
      # default in a workflow that also runs on `push`, which describes most
      # projects and almost none of the vulnerable ones. High-confidence
      # findings still fail the build.
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --min-severity=medium --min-confidence=medium .

      # A tag is a name the publisher can move; a commit is not. Local actions
      # (`./...`) are this repository's own and carry no `@ref` to pin.
      - name: Every external action is pinned to a commit
        run: |
          unpinned="$(grep -rhoE 'uses: [^.][^ ]*@[^ ]+' .github/ | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::pin these to a commit SHA, not a tag:"
            echo "$unpinned"
            exit 1
          fi
