# How TOML is formatted, checked by this repository's CI, and by the gate of
# every project it generates.
#
# Two settings, both to keep taplo from undoing what the files already do.
# Everything else is taplo's default, on purpose: the point of a formatter is
# to stop having the argument, and a long configuration file is the argument
# in a different place.
[formatting]
# A one-line list stops being readable at the third entry, and every list here
# — targets, allowed licenses, packaged paths — is edited and read in a diff
# one line at a time.
array_auto_collapse = false
# Four, matching the Rust beside it. taplo's own default is two.
indent_string = "    "
